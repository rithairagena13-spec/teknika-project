<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <header>
            <h1>TaskFlow</h1>
            <p id="counter">3 left</p>
        </header>

        <main>
            <!-- FORM -->
            <form id="form">
                <input type="text" id="input" placeholder="New task..." required>
                <button type="submit" id="add">Add</button>
            </form>

            <!-- FILTERS -->
            <div class="tabs">
                <button class="btn active">All</button>
                <button class="btn">Active</button>
                <button class="btn">Done</button>
            </div>

            <!-- TASK LIST -->
            <ul id="list">
                <!-- Task 1 -->
                <li class="item">
                    <div class="row">
                        <input type="checkbox" id="t1" class="check">
                        <label for="t1" class="text">Learn HTML</label>
                    </div>
                    <div class="actions">
                        <button class="edit">Edit</button>
                        <button class="del">Delete</button>
                    </div>
                </li>

                <!-- Task 2 -->
                <li class="item done">
                    <div class="row">
                        <input type="checkbox" id="t2" class="check" checked>
                        <label for="t2" class="text">Create folder</label>
                    </div>
                    <div class="actions">
                        <button class="edit">Edit</button>
                        <button class="del">Delete</button>
                    </div>
                </li>

                <!-- Task 3 -->
                <li class="item">
                    <div class="row">
                        <input type="checkbox" id="t3" class="check">
                        <label for="t3" class="text">Read rules</label>
                    </div>
                    <div class="actions">
                        <button class="edit">Edit</button>
                        <button class="del">Delete</button>
                    </div>
                </li>
            </ul>
        </main>
    </div>
<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "REMOVED_API_KEY",
    authDomain: "taskflow-app-5b420.firebaseapp.com",
    projectId: "taskflow-app-5b420",
    storageBucket: "taskflow-app-5b420.firebasestorage.app",
    messagingSenderId: "941988575431",
    appId: "1:941988575431:web:5dffb053724685791766e2"
  } ;

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>

</body>
</html>
